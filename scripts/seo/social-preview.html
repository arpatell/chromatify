<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="/fonts/fonts.css"/><style>
* { box-sizing: border-box; } body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #121719; color: #edf0e8; font-family: Manrope, sans-serif; }
main { display: grid; grid-template-columns: 1.1fr 1fr; gap: 54px; height: 100%; padding: 58px 64px; }
.copy { display: flex; flex-direction: column; align-items: flex-start; }
.brand { display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 36px; letter-spacing: -.04em; }
h1 { margin: 58px 0 0; font-size: 68px; line-height: 1.06; letter-spacing: -.04em; font-weight: 800; }
p { font-size: 19px; color: #aebbbd; line-height: 1.6; margin: 26px 0 0; }
.colors { align-self: center; display: flex; flex-direction: column; gap: 20px; }
.sleeve { height: 370px; border-radius: 14px; background: radial-gradient(ellipse at 10% 10%, #b6a0d7, transparent 65%), radial-gradient(ellipse at 90% 25%, #99bcae, transparent 65%), linear-gradient(145deg, #b6a0d7, #e6ad96 65%, #99bcae); }
.swatches { display: flex; gap: 14px; height: 20px; } .swatches span { flex: 1; border-radius: 4px; background: #b6a0d7; } .swatches span:nth-child(2) { background: #e6ad96; } .swatches span:nth-child(3) { background: #99bcae; }
.attribution { display: flex; justify-content: space-between; align-items: center; color: #aebbbd; font-size: 13px; } .attribution span { display: inline-flex; align-items: center; gap: 6px; } .attribution img { object-fit: contain; filter: brightness(0) invert(1); }
</style></head><body><main><div class="copy"><div class="brand">Chromatify<img src="/brand-aura.png" width="34" height="34" alt=""/></div><h1>Your music.<br/>In full color.</h1><p>Spotify colors.<br/>A music aura to share.</p></div><div class="colors"><div class="sleeve"></div><div class="swatches"><span></span><span></span><span></span></div><div class="attribution"><span>Your music, in color.</span><span>Made with<img src="/spotify-logo.png" width="72" height="22" alt="Spotify"/></span></div></div></main></body></html>
