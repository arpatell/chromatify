<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121719" />
  <link rel="preload" href="%PUBLIC_URL%/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="%PUBLIC_URL%/fonts/barlow-condensed-900-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="%PUBLIC_URL%/fonts/fonts.css" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="%PUBLIC_URL%/favicon.svg" />
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('chromatify-theme') === 'light' ? 'light' : 'dark'; } catch (_) {}</script>
  {{METADATA}}
  <script>
    // Keep OAuth callbacks and individual aura snapshots out of search listings.
    if (location.pathname === '/callback' || /(?:^|[?&])(?:aura|code|error)=/.test(location.search)) {
      document.querySelector('meta[name="robots"]').content = 'noindex,follow';
    }
  </script>
</head>
<body>
  <div id="root">{{FALLBACK}}</div>
</body>
</html>
